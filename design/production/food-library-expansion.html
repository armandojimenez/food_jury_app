<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodJury · The expanded menu</title>
<style>
@font-face{font-family:Bangers;src:url('../../assets/fonts/Bangers-Regular.ttf')}
@font-face{font-family:Nunito;src:url('../../assets/fonts/Nunito-ExtraBold.ttf');font-weight:800}
*{box-sizing:border-box}body{margin:0;background:#fff7e8;color:#1c2135;font-family:Nunito,sans-serif;font-weight:800}
header{position:relative;padding:30px 40px 26px;background:#ff7432;border-bottom:4px solid #1c2135;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;letter-spacing:4px;margin-bottom:6px}h1{margin:0;font:66px/.95 Bangers;letter-spacing:1px;color:#fff7e8;-webkit-text-stroke:1.5px #1c2135;text-shadow:3px 4px #1c2135}
.badge{border:3px solid #1c2135;border-radius:50%;background:#ffcd45;width:108px;height:108px;display:grid;place-content:center;text-align:center;transform:rotate(9deg);box-shadow:4px 4px #1c2135;line-height:1.1;font-size:14px}
.badge strong{font:46px Bangers}.checks{height:18px;background:conic-gradient(#1c2135 25%,#fff7e8 0 50%,#1c2135 0 75%,#fff7e8 0);background-size:36px 36px}
main{padding:20px 30px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
figure{margin:0;min-width:0;background:#fffaf1;border:2px solid #1c2135;border-radius:18px;box-shadow:3px 3px #1c2135;padding:10px 8px 12px;text-align:center}
img{width:100%;height:160px;object-fit:contain;display:block}figcaption{font-size:17px;line-height:1.3;margin-top:3px}
footer{display:flex;justify-content:space-between;gap:16px;padding:8px 32px 24px;font-size:13px;letter-spacing:.3px}
@media(max-width:800px){main{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:44px}header{padding:20px}.badge{width:85px;height:85px}footer{flex-wrap:wrap}}
</style></head><body>
