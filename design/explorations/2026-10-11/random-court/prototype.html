<script>
(()=>{
const root=document.getElementById('fj-lucky'),screen=root.querySelector('#lc-screen'),header=root.querySelector('#lc-header'),nav=root.querySelector('#lc-nav'),announcer=root.querySelector('#lc-announcer');
const art=__ASSET_DATA__,catalog=__SAYINGS_DATA__;
const initialOptions=[{id:'pizza',name:'Pizza',notes:'A slice from our usual spot.',art:'pizza'},{id:'tacos',name:'Tacos',notes:'The little place around the corner.',art:'tacos'},{id:'burger',name:'Burger',notes:'Our neighborhood diner.',art:'burger'},{id:'salad',name:'Salad bowl',notes:'Something from the salad bar.',art:'salad'},{id:'sushi',name:'Sushi',notes:'The place we bookmarked.',art:'sushi'}];
const methods={wheel:{name:'Spin the Plate',short:'The crowd pleaser',verb:'Spin for dinner',loading:'The plate is deliberating…',help:'One spin. Every contender gets an equal slice.',mini:'plate'},ticket:{name:'Order Up!',short:'Pull a diner ticket',verb:'Pull my ticket',loading:'One order coming right up…',help:'One ticket per contender. The court pulls one.',mini:'ticket'},cloche:{name:'Cloche Call',short:'The grand reveal',verb:'Lift the lid',loading:'A little suspense is in order…',help:'One equal-chance draw. One dramatic reveal.',mini:'cloche'},coin:{name:'Coin Court',short:'A classic two-way tie',verb:'Flip for dinner',loading:'Two sides. One delicious dilemma…',help:'Heads or tails. Exactly two contenders. 50–50.',mini:'coin'}};
const tones={stern:'Stern',sassy:'Sassy',enthusiastic:'Enthusiastic',chill:'Chill'};
const state={device:'phone',version:1,revision:0,screen:'home',method:'wheel',tone:'stern',locale:'en',credits:0,premium:false,goal:'Fun',plan:'year',options:initialOptions.slice(0,4).map(o=>({...o})),history:[],verdict:null,bags:{},lastQuote:null,reduceMotion:false};
const photoData=new Map();let running=false,pending=null,timer=null,ticketTimer=null,draft=null,draftPhoto=null,photoReadToken=0,editIndex=-1,returnFromPlus='home',fromHistory=false,notice='',drawCount=0;
const media=matchMedia('(prefers-reduced-motion: reduce)');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i data-lucide="${name}" class="lc-icon" aria-hidden="true"></i>`;
const img=(key,cls='',alt='')=>`<img src="${art[key]||art.meal}" class="${cls}" alt="${esc(alt)}" draggable="false">`;
const food=(o,cls='')=>`<img src="${(draft&&state.screen==='editor'&&o.id===draft.id?draftPhoto:photoData.get(o.photoKey))||art[o.art]||art.meal}" class="${cls} ${(draft&&state.screen==='editor'&&o.id===draft.id?draftPhoto:photoData.has(o.photoKey))?'lc-photo':''}" alt="" draggable="false">`;
const btn=(label,action,secondary=false,extra='')=>`<button type="button" class="lc-action cursor-interaction${secondary?' secondary':''}" data-action="${action}" ${extra}>${label}</button>`;
const link=(label,action,extra='')=>`<button type="button" class="lc-link cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
const reduced=()=>state.reduceMotion||media.matches;
const announce=text=>{announcer.textContent=text;};
function persist(){state.revision=Math.max(state.revision+1,Date.now());if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Lucky Court',method:state.method,tone:state.tone,screen:state.screen,freeAIRemaining:state.credits,premiumPreview:state.premium},privateContent:{...state,screen:state.screen==='verdict'?'method':state.screen==='editor'?'case':state.screen,history:[],verdict:null,bags:Object.fromEntries(Object.entries(state.bags).slice(-4))}}).catch(()=>{});}
function clearRun(){clearTimeout(timer);clearTimeout(ticketTimer);timer=null;ticketTimer=null;running=false;pending=null;}
function route(next,{focus=true,save=true}={}){clearRun();notice='';state.screen=next;render();screen.classList.add('lc-route-enter');if(save)persist();if(focus)focusMain();}
function focusMain(){const target=screen.querySelector('[data-primary],.lc-action,input,button,select');if(target){target.setAttribute('aria-describedby','lc-heading');target.focus({preventScroll:true});}announce(screen.querySelector('#lc-heading')?.textContent||header.textContent);}
function randomIndex(n){if(!Number.isInteger(n)||n<1||n>10000)throw Error('Invalid random draw size');const limit=Math.floor(4294967296/n)*n;const value=new Uint32Array(1);do{crypto.getRandomValues(value);}while(value[0]>=limit);return value[0]%n;}
function nextQuote(method){const eligible=catalog.entries.filter(q=>(q.tone===state.tone||q.tone==='any')&&q.methods.includes(method));const key=`${state.tone}:${method}:${state.locale}`;let bag=(state.bags[key]||[]).filter(id=>eligible.some(q=>q.id===id));if(!bag.length){bag=eligible.map(q=>q.id);for(let i=bag.length-1;i>0;i--){const j=randomIndex(i+1);[bag[i],bag[j]]=[bag[j],bag[i]];}if(bag.length>1&&bag[bag.length-1]===state.lastQuote)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]];}const id=bag.pop();state.bags[key]=bag;state.lastQuote=id;return {id,text:eligible.find(q=>q.id===id).text[state.locale]};}
function credits(){return state.premium?'<span class="lc-pill yellow">PLUS · UNLIMITED AI</span>':`<div class="lc-credit-row"><span class="lc-credit-dots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<3-state.credits?'used':''}">${i<3-state.credits?'✓':'✦'}</i>`).join('')}</span><span>${state.credits} of 3 free AI rulings left</span></div>`;}
function optionsLegend(coin=false){return `<div class="lc-contenders">${state.options.map((o,i)=>`<span><b class="lc-number">${coin?(i===0?'H':'T'):i+1}</b><span>${esc(o.name)}</span></span>`).join('')}</div>`;}
function title(text,sub='',kicker=''){return `<div class="lc-center">${kicker?`<p class="lc-kicker">${kicker}</p>`:''}<h2 class="lc-display" id="lc-heading">${text}</h2>${sub?`<p class="lc-sub" style="margin-top:10px">${sub}</p>`:''}</div>`;}
function render(){root.dataset.device=state.device;screen.dataset.screen=state.screen;root.dataset.reduce=String(reduced());screen.className='lc-body';const names={home:'Lucky Court',case:'Build a case',method:'How shall we rule?',play:methods[state.method].name,verdict:'The lucky verdict',history:'Court records',editor:editIndex<0?'Add a contender':'Edit contender',plus:'FoodJury Plus','ai-confirm':'An AI ruling'};const back=state.screen==='home'||state.screen==='history'?'<span></span>':`<button type="button" class="lc-round cursor-interaction" data-action="back" aria-label="Go back">${icon('arrow-left')}</button>`;header.innerHTML=`${back}<h1>${names[state.screen]||'Lucky Court'}</h1><span aria-hidden="true">${icon('sparkles')}</span>`;
nav.hidden=!['home','history'].includes(state.screen);nav.innerHTML=`<button type="button" class="cursor-interaction" data-action="home" ${state.screen==='home'?'aria-current="page"':''}>${icon('house')} Court</button><button type="button" class="cursor-interaction" data-action="history" ${state.screen==='history'?'aria-current="page"':''}>${icon('clock-3')} History${state.history.length?` · ${state.history.length}`:''}</button>`;
if(state.screen==='home'){screen.innerHTML=`${title('Same judge.<br>New tricks.','','The court is always open')}<div class="lc-hero">${img('plate')}<span class="lc-sticker" aria-hidden="true"><span>ALWAYS</span>OPEN</span><span class="lc-star" aria-hidden="true">✦</span></div><div class="lc-center">${credits()}<p class="lc-sub" style="margin-top:12px">${state.premium?'Every way to settle dinner. Unlimited AI and Lucky rulings.':state.credits>0?'Save your AI rulings for the tough calls. Lucky rulings are always free.':'Your 3 free AI rulings are used.<br><b>Lucky rulings are free and unlimited.</b>'}</p></div><div class="lc-actions">${btn(icon('utensils')+' Start a food case','case',false,'data-primary')}${link(state.premium?'Explore the Lucky methods':'Explore FoodJury Plus',state.premium?'method':'plus')}</div>`;}
if(state.screen==='case'){screen.innerHTML=`${title('Who’s on the menu?','Bring 2–5 contenders. Your photos and notes are welcome.')}<div class="lc-case-list">${state.options.map((o,i)=>`<div class="lc-option">${food(o)}<div><b>${esc(o.name)}</b><p class="lc-small">${esc(o.notes)||'No notes yet'}</p></div><button type="button" class="lc-edit cursor-interaction" data-edit="${i}" aria-label="Edit ${esc(o.name)}">${icon('pencil')}</button></div>`).join('')}${state.options.length<5?'<button type="button" class="lc-add cursor-interaction" data-action="add">+ Add a contender</button>':''}</div><div><span class="lc-section-label">Tonight’s mood</span><div class="lc-picks">${['Fun','Healthy','Fit','Quick'].map(g=>`<button type="button" class="lc-pick cursor-interaction" data-goal="${g}" aria-pressed="${state.goal===g}">${g}</button>`).join('')}</div><p class="lc-small" style="margin-top:8px">Mood helps AI rulings. Lucky rulings use equal odds.</p></div><div class="lc-actions">${btn('Choose how to decide '+icon('arrow-right'),'method',false,'data-primary')}</div>`;}
if(state.screen==='method'){screen.innerHTML=`${title('A little wisdom.<br>Or a little luck.')}<button type="button" class="lc-ai cursor-interaction" data-action="ai">${img('thinking')}<span><b>Ask Judge Bite · AI</b><span class="lc-small">${state.premium?'Unlimited with Plus':state.credits>0?`${state.credits} of 3 free lifetime rulings left`:'Your 3 free AI rulings are used'}</span></span>${icon(state.premium||state.credits?'arrow-right':'lock-keyhole')}</button><div class="lc-separator">Lucky Court</div><p class="lc-note" style="margin-top:-9px"><b>Free forever · Offline · Equal chances</b></p><div class="lc-method-grid">${Object.entries(methods).map(([id,m])=>`<button type="button" class="lc-method cursor-interaction" data-method="${id}" aria-pressed="${state.method===id}" ${id==='coin'&&state.options.length!==2?'aria-disabled="true" aria-describedby="lc-coin-help"':''}><span class="lc-selected" aria-hidden="true">${state.method===id?'✓':''}</span><span class="lc-mini" aria-hidden="true"><span class="lc-mini-${m.mini}">${id==='ticket'?'?':id==='coin'?'H':''}</span></span><strong>${m.name}</strong><span>${id==='coin'&&state.options.length!==2?'Needs exactly 2 contenders':m.short}</span></button>`).join('')}</div><div class="lc-row"><label for="lc-tone" class="lc-small"><b>Judge’s personality</b></label><select id="lc-tone" style="font-size:14px;max-width:52%;border:1.5px solid var(--lc-line);background:var(--lc-panel);color:var(--lc-text);border-radius:7px;padding:9px">${Object.entries(tones).map(([v,l])=>`<option value="${v}" ${state.tone===v?'selected':''}>${l}</option>`).join('')}</select></div><p id="lc-coin-help" class="lc-note">${notice||`${state.options.length} contenders · ${link('Edit case','case')}`}</p><div class="lc-actions">${btn('Try '+methods[state.method].name+' '+icon('arrow-right'),'play',false,'data-primary')}</div>`;}
if(state.screen==='play')renderPlay();
if(state.screen==='verdict')renderVerdict();
if(state.screen==='history'){screen.innerHTML=`${title('Dinner, on record.',state.history.length?'Saved in this preview session. Labeled by method.':'Every saved verdict gets a seat here.')}<div class="lc-case-list">${state.history.length?state.history.slice().reverse().map(v=>`<button type="button" class="lc-history-item cursor-interaction" data-history="${esc(v.id)}">${food(v.options[v.winner])}<span><b>${esc(v.options[v.winner].name)}</b><small>Lucky · ${methods[v.method].name}</small><small>Saved this session</small></span>${icon('chevron-right')}</button>`).join(''):`<div class="lc-empty">${img('idle')}<p>Bring the options.<br>We’ll keep the dinner receipts.</p></div>`}</div><div class="lc-actions">${btn('Start a food case','case',false,'data-primary')}</div>`;}

function renderPlay(){const m=methods[state.method],n=state.options.length;let stage='';if(state.method==='wheel'){const colors=['#ff6b35','#ffd23f','#fff8f0','#a6bc7d','#f8b397'];const gradient=state.options.map((o,i)=>`${colors[i]} ${i*100/n}% ${(i+1)*100/n}%`).join(',');stage=`<div class="lc-plate-frame"><div class="lc-wheel ${running?'spinning':''}" style="background:conic-gradient(${gradient});--turn:${pending?1800+360-(pending.winner+.5)*360/n:0}deg" aria-hidden="true">${state.options.map((o,i)=>{const a=(i+.5)*2*Math.PI/n;return `<span class="lc-wheel-item" style="left:${50+33*Math.sin(a)}%;top:${50-33*Math.cos(a)}%">${food(o)}<b>${i+1}</b></span>`;}).join('')}<span class="lc-wheel-hub">✦</span></div></div>`;}

function renderVerdict(){const v=state.verdict;if(!v){state.screen='method';render();return;}const winner=v.options[v.winner];screen.classList.add('lc-enter');const pose=v.tone==='stern'?'stern':v.tone==='chill'?'idle':v.tone==='sassy'?'ticket':'celebrating';screen.innerHTML=`${fromHistory?'<p class="lc-history-ribbon">Saved court record</p>':''}<div class="lc-center"><span class="lc-stamp">CASE CLOSED</span><p class="lc-kicker">LUCKY PICK · ${methods[v.method].name.toUpperCase()}</p><h2 class="lc-display lc-result-heading" id="lc-heading">${esc(winner.name)}<br>it is!</h2></div><div class="lc-result-art"><div class="lc-burst" aria-hidden="true"></div>${food(winner,'lc-result-food')}${img(pose,'lc-result-judge')}${reduced()||fromHistory?'':`<div class="lc-bits" aria-hidden="true">${Array.from({length:12},(_,i)=>`<i style="--x:${(i*37)%100}%;--d:${i*18}ms;--r:${160+i*21}deg;--c:${i%2?'#ff6b35':'#1a1a2e'}"></i>`).join('')}</div>`}</div><div class="lc-ticket lc-verdict-ticket"><p class="lc-quote" lang="${v.locale}">“${esc(v.quote.text)}”</p><span class="lc-signature">— Judge Bite</span><hr class="lc-rule"><p class="lc-small">Random pick · Equal odds · No AI used</p></div><div class="lc-actions">${v.saved?btn('Back to court records','history',false,'data-primary'):btn(icon('bookmark')+' Save & close case','save',false,'data-primary')}<div class="lc-row">${link('Replay reveal','replay')}${link('Draw again','redraw')}</div>${link('Try another method','another-method')}</div>`;}
function renderEditor(){if(!draft){state.screen='case';render();return;}screen.innerHTML=`${title(editIndex<0?'A new contender.':'The evidence.','Names are required. Photos and notes are optional.')}<div id="lc-edit-form" class="lc-form"><div class="lc-photo-editor">${food(draft)}<div><label for="lc-photo-input">Your own photo<input id="lc-photo-input" type="file" accept="image/*"></label><p class="lc-photo-note" style="margin-top:7px">Camera or photo library · stays on your device in this preview</p>${draftPhoto?link('Remove photo','remove-photo'):''}</div></div><label for="lc-name-input">Contender name<input id="lc-name-input" required maxlength="80" value="${esc(draft.name)}" placeholder="e.g. My favorite ramen"></label><label for="lc-note-input">Notes<textarea id="lc-note-input" maxlength="500" rows="3" placeholder="Anything the judge should know">${esc(draft.notes)}</textarea></label><p class="lc-small">Photos and notes stay with your case. They do not change the odds in Lucky Court.</p>${notice?`<p class="lc-alert" role="alert">${esc(notice)}</p>`:''}<div class="lc-actions"><button type="button" class="lc-action cursor-interaction" data-action="save-option" data-primary>Save contender</button>${editIndex>=0?link(state.options.length>2?'Remove contender':'Keep at least 2 contenders','remove-option',state.options.length<=2?'disabled':''):''}${link('Cancel','cancel-edit')}</div></div>`;}
function startDraw(){if(running)return;if(state.options.length<2||state.options.length>5||(state.method==='coin'&&state.options.length!==2)){notice='Coin Court needs exactly two contenders.';route('method');return;}drawCount++;const winner=randomIndex(state.options.length);pending={id:crypto.randomUUID(),method:state.method,tone:state.tone,locale:state.locale,options:state.options.map(o=>({...o})),winner,quote:nextQuote(state.method),goal:state.goal,saved:false};running=true;fromHistory=false;if(reduced()){finishDraw();return;}render();announce('Drawing a random verdict. Every contender has an equal chance.');screen.querySelector('[data-action="finish"]')?.focus({preventScroll:true});if(state.method==='ticket')ticketTimer=setTimeout(()=>{const el=root.querySelector('#lc-order-reveal');if(el&&pending){el.innerHTML=`${food(pending.options[pending.winner])}<p class="lc-title">#${pending.winner+1}</p>`;}},2100);timer=setTimeout(finishDraw,state.method==='wheel'?3300:3100);}
function finishDraw(){if(!pending)return;const result=pending;clearRun();state.verdict=result;state.screen='verdict';render();persist();focusMain();announce(`${result.options[result.winner].name} wins. Random pick by ${methods[result.method].name}. ${result.quote.text}`);}
function openEditor(index){photoReadToken++;draftPhoto=index<0?null:photoData.get(state.options[index].photoKey)||null;editIndex=index;draft=index<0?{id:crypto.randomUUID(),name:'',notes:'',art:'meal'}:{...state.options[index]};route('editor');}
function onBack(){if(state.screen==='editor'){draft=null;route('case');return;}if(state.screen==='plus'){route(returnFromPlus);return;}route({case:'home',method:'case',play:'method',verdict:fromHistory?'history':'method','ai-confirm':'method'}[state.screen]||'home');}
root.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;if(el.dataset.edit!==undefined){openEditor(Number(el.dataset.edit));return;}if(el.dataset.goal){state.goal=el.dataset.goal;render();persist();root.querySelector(`[data-goal="${state.goal}"]`)?.focus({preventScroll:true});return;}if(el.dataset.method){const id=el.dataset.method;if(id==='coin'&&state.options.length!==2){notice='Coin Court needs two contenders. Edit your case to use it.';render();announce(notice);root.querySelector('[data-method="coin"]')?.focus({preventScroll:true});return;}state.method=id;notice='';render();persist();root.querySelector(`[data-method="${id}"]`)?.focus({preventScroll:true});announce(`${methods[id].name} selected.`);return;}if(el.dataset.plan){state.plan=el.dataset.plan;render();persist();root.querySelector(`[data-plan="${state.plan}"]`)?.focus({preventScroll:true});return;}if(el.dataset.history){const v=state.history.find(v=>v.id===el.dataset.history);if(v){state.verdict=v;fromHistory=true;route('verdict');}return;}
const action=el.dataset.action;if(!action)return;
if(['home','case','method','play','history'].includes(action)){if(action==='method'&&state.method==='coin'&&state.options.length!==2)state.method='wheel';route(action);}
else if(action==='save-option')saveEditor();else if(action==='back')onBack();else if(action==='draw')startDraw();else if(action==='finish')finishDraw();else if(action==='add')openEditor(-1);else if(action==='cancel-edit'){draft=null;route('case');}
else if(action==='remove-option'&&state.options.length>2&&editIndex>=0){state.options.splice(editIndex,1);draft=null;if(state.method==='coin'&&state.options.length!==2)state.method='wheel';route('case');}
else if(action==='remove-photo'&&draft){photoReadToken++;draftPhoto=null;draft.name=root.querySelector('#lc-name-input').value;draft.notes=root.querySelector('#lc-note-input').value;render();root.querySelector('#lc-photo-input')?.focus({preventScroll:true});}
else if(action==='save'&&state.verdict){state.verdict.saved=true;if(!state.history.some(v=>v.id===state.verdict.id))state.history.push({...state.verdict});route('history');announce('Verdict saved in this preview.');}
else if(action==='replay'){render();focusMain();announce(`Replaying the same verdict. ${state.verdict.options[state.verdict.winner].name}.`);}
else if(action==='another-method'&&state.verdict){state.options=state.verdict.options.map(o=>({...o}));state.method=state.verdict.method;route('method');}
else if(action==='redraw'){state.options=state.verdict.options.map(o=>({...o}));state.method=state.verdict.method;route('play');startDraw();}

root.addEventListener('change',event=>{if(event.target.id==='lc-tone'){state.tone=event.target.value;persist();announce(`${tones[state.tone]} judge selected.`);}if(event.target.id==='lc-photo-input'){const f=event.target.files[0];if(!f||!draft)return;draft.name=root.querySelector('#lc-name-input').value;draft.notes=root.querySelector('#lc-note-input').value;if(!f.type.startsWith('image/')||f.size>8*1024*1024){notice='Choose an image smaller than 8 MB.';render();return;}const id=draft.id,readToken=++photoReadToken;const reader=new FileReader();reader.onload=()=>{if(readToken!==photoReadToken||!draft||draft.id!==id||state.screen!=='editor')return;draft.name=root.querySelector('#lc-name-input').value;draft.notes=root.querySelector('#lc-note-input').value;draftPhoto=String(reader.result);notice='';render();root.querySelector('#lc-name-input')?.focus({preventScroll:true});announce('Photo added to the contender.');};reader.onerror=()=>{if(readToken!==photoReadToken||!draft||draft.id!==id||state.screen!=='editor')return;draft.name=root.querySelector('#lc-name-input').value;draft.notes=root.querySelector('#lc-note-input').value;notice='That photo could not be opened. Please try another.';render();root.querySelector('#lc-photo-input')?.focus({preventScroll:true});};reader.readAsDataURL(f);}});
function saveEditor(){if(!draft||state.screen!=='editor')return;const name=root.querySelector('#lc-name-input').value.trim();if(!name){draft.name='';draft.notes=root.querySelector('#lc-note-input').value;notice='Give your contender a name.';render();root.querySelector('#lc-name-input')?.focus();return;}draft.name=name;draft.notes=root.querySelector('#lc-note-input').value.trim();photoReadToken++;if(draftPhoto){draft.photoKey=crypto.randomUUID();photoData.set(draft.photoKey,draftPhoto);}else delete draft.photoKey;if(editIndex<0)state.options.push({...draft});else state.options[editIndex]={...draft};draft=null;draftPhoto=null;route('case');}
root.addEventListener('keydown',event=>{if(event.target.id==='lc-name-input'&&event.key==='Enter'){event.preventDefault();saveEditor();}});
function restore(saved){const raw=saved?.privateContent;if(!raw||raw.version!==1||(state.revision>0&&Number(raw.revision||0)<=state.revision))return;const allowed=['home','case','method','play','verdict','history','plus','ai-confirm'];clearRun();state.revision=Number(raw.revision)||0;state.screen=allowed.includes(raw.screen)?raw.screen:'home';state.method=methods[raw.method]?raw.method:'wheel';state.tone=tones[raw.tone]?raw.tone:'stern';state.locale=raw.locale==='es'?'es':'en';state.credits=Math.max(0,Math.min(3,Math.floor(Number(raw.credits)||0)));state.premium=raw.premium===true;state.device=raw.device==='tablet'?'tablet':'phone';state.reduceMotion=raw.reduceMotion===true;state.plan=raw.plan==='month'?'month':'year';state.goal=['Fun','Healthy','Fit','Quick'].includes(raw.goal)?raw.goal:'Fun';if(Array.isArray(raw.options)&&raw.options.length>=2&&raw.options.length<=5&&raw.options.every(o=>typeof o.id==='string'&&typeof o.name==='string'&&o.name.trim()))state.options=raw.options.map(o=>({id:o.id.slice(0,80),name:o.name.slice(0,80),notes:String(o.notes||'').slice(0,500),photoKey:typeof o.photoKey==='string'?o.photoKey:undefined,art:art[o.art]?o.art:'meal'}));if(state.method==='coin'&&state.options.length!==2)state.method='wheel';const valid=v=>v&&methods[v.method]&&Array.isArray(v.options)&&v.options.length>=2&&v.options.length<=5&&Number.isInteger(v.winner)&&v.winner>=0&&v.winner<v.options.length&&v.options.every(o=>typeof o.id==='string'&&typeof o.name==='string')&&v.quote&&typeof v.quote.text==='string';state.verdict=valid(raw.verdict)?raw.verdict:null;state.history=Array.isArray(raw.history)?raw.history.filter(valid):[];state.lastQuote=typeof raw.lastQuote==='string'?raw.lastQuote:null;state.bags={};if(raw.bags&&typeof raw.bags==='object')for(const [k,v] of Object.entries(raw.bags).slice(0,32)){if(Array.isArray(v))state.bags[k]=v.filter(x=>catalog.entries.some(e=>e.id===x)).slice(0,44);}if(state.screen==='verdict'&&!state.verdict)state.screen='method';if(state.screen==='ai-confirm'&&!state.premium&&!state.credits)state.screen='method';render();}
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});media.addEventListener('change',()=>{root.dataset.reduce=String(reduced());if(reduced()&&running)finishDraw();});
